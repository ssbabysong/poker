<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="牌局本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>牌局本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one quiet column. Hairlines instead of cards; a serif numeral carries the page. */
:root{
  --bg:#f7f7f5; --sheet:#ffffff; --ink:#111113; --sub:#76767c; --hair:#e4e4e1; --soft:#eeeeeb;
  --win:#2e7a57; --loss:#b0463b; --gold:#9a7b3f;
  --serif:"Instrument Serif","Songti SC","STSong",Georgia,serif;
  --sans:"Manrope",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --sheet:#151517; --ink:#f2f1ee; --sub:#8b8b91; --hair:#242427; --soft:#1c1c1f;
  --win:#6fc39b; --loss:#e48a7e; --gold:#c9a96a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --sheet:#151517; --ink:#f2f1ee; --sub:#8b8b91; --hair:#242427; --soft:#1c1c1f;
  --win:#6fc39b; --loss:#e48a7e; --gold:#c9a96a; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:3px;border-radius:4px}
.tn{font-variant-numeric:tabular-nums}
.win{color:var(--win)}.loss{color:var(--loss)}.sub{color:var(--sub)}

.app{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 22px calc(110px + var(--safe-b))}
header{display:flex;align-items:center;justify-content:space-between}
.brand{font-family:var(--serif);font-size:22px;letter-spacing:.5px}
.brand i{color:var(--gold);font-style:normal;margin-right:6px}
.gear{width:36px;height:36px;display:grid;place-items:center;margin-right:-8px;color:var(--sub)}
.gear svg{width:19px;height:19px}

.tabs{display:flex;gap:26px;margin:22px 0 0;border-bottom:1px solid var(--hair)}
.tabs button{padding:0 0 10px;font-size:14px;color:var(--sub);font-weight:500;position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--ink)}

.hero{padding:40px 0 8px}
.eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--sub);text-transform:uppercase}
.total{font-family:var(--serif);font-size:72px;line-height:1;margin:14px 0 0;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.total .cur{font-size:.5em;vertical-align:.55em;margin:0 3px 0 2px;letter-spacing:0}
.trio{display:flex;gap:28px;margin-top:22px}
.trio div{font-size:12px;color:var(--sub)}
.trio b{display:block;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:1px}
.trio b.win{color:var(--win)}.trio b.loss{color:var(--loss)}

.chart{margin:30px -4px 0;position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.chart .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px;padding:0 4px}
.scrub{position:absolute;top:-6px;left:0;transform:translateX(-50%);font-size:11px;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}

h2{font-size:11px;letter-spacing:2.5px;color:var(--sub);font-weight:500;margin:44px 0 6px;display:flex;justify-content:space-between;align-items:baseline;text-transform:uppercase}
h2 button{font-size:12px;letter-spacing:0;color:var(--sub);text-transform:none}

.rows{border-top:1px solid var(--hair)}
.r{display:flex;align-items:center;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--hair);gap:14px}
.r .d{width:46px;flex:none;font-size:11px;color:var(--sub);line-height:1.3}
.r .d b{display:block;font-family:var(--serif);font-size:24px;font-weight:400;color:var(--ink);line-height:1}
.r .m{flex:1;min-width:0}
.r .m .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .m .n{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 4px}
.mh span:first-child{font-family:var(--serif);font-size:24px}
.mh span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.mh small{font-family:var(--sans);font-size:12px;color:var(--sub);margin-left:8px}

.kv{border-top:1px solid var(--hair)}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair)}
.kv span{color:var(--sub)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

.periods{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.periods button{font-size:13px;padding:6px 13px;border-radius:99px;color:var(--sub);border:1px solid var(--hair)}
.periods button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.loc{padding:14px 0;border-bottom:1px solid var(--hair)}
.loc:first-child{border-top:1px solid var(--hair)}
.loc .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.loc .top b{font-weight:600;font-variant-numeric:tabular-nums}
.loc .meta{font-size:12px;color:var(--sub);margin-top:2px}
.bar{height:3px;background:var(--soft);border-radius:2px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}

.empty{padding:70px 0 20px;text-align:center}
.empty .suits{font-family:var(--serif);font-size:30px;letter-spacing:12px;color:var(--gold)}
.empty p{color:var(--sub);margin:16px 0 26px;line-height:1.8}
.empty .link{font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px;margin-top:18px}

.add{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);
  padding:14px 30px;border-radius:99px;font-weight:600;font-size:15px;letter-spacing:1px;box-shadow:0 10px 30px #0000002e;display:flex;align-items:center;gap:8px}
.add svg{width:16px;height:16px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:13px 28px;border-radius:99px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--hair)}

/* sheet */
.scrim{position:fixed;inset:0;background:#0000004d;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--sheet);border-radius:24px 24px 0 0;
  max-height:94vh;overflow:auto;padding:10px 22px calc(22px + var(--safe-b));transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet:not(.show){visibility:hidden;transition:transform .32s,visibility 0s .32s}
.grab{width:36px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 18px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sh h3{font-family:var(--serif);font-weight:400;font-size:28px;margin:0}
.sh button{font-size:14px;color:var(--sub)}

.wl{display:flex;justify-content:center;gap:4px;margin:18px auto 0;background:var(--soft);border-radius:99px;padding:4px;width:max-content}
.wl button{padding:7px 26px;border-radius:99px;font-size:14px;font-weight:600;color:var(--sub)}
.wl button.on[data-v="1"]{background:var(--sheet);color:var(--win);box-shadow:0 1px 4px #0000001a}
.wl button.on[data-v="-1"]{background:var(--sheet);color:var(--loss);box-shadow:0 1px 4px #0000001a}
.amt{display:flex;align-items:baseline;justify-content:center;margin:18px 0 8px;font-family:var(--serif)}
.amt span{font-size:34px;color:var(--sub);margin-right:4px}
.amt input{font-family:var(--serif);font-size:64px;border:0;background:none;color:var(--ink);width:5ch;text-align:left;padding:0;outline:0;font-variant-numeric:tabular-nums}
.amt input::placeholder{color:var(--hair)}
.amt.win input{color:var(--win)}.amt.loss input{color:var(--loss)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.field{border-top:1px solid var(--hair);display:flex;align-items:center;min-height:54px;gap:12px}
.field.last{border-bottom:1px solid var(--hair)}
.field label{width:46px;flex:none;font-size:13px;color:var(--sub)}
.field input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:16px var(--sans);padding:14px 0;outline:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 12px 58px;margin-top:-4px}
.chips button{font-size:12px;padding:4px 11px;border-radius:99px;background:var(--soft);color:var(--sub)}
.foot{display:flex;gap:10px;margin-top:24px}
.foot .btn{flex:1;text-align:center}
.foot .del{flex:0 0 auto;color:var(--loss);padding:13px 18px}
.msg{color:var(--sub);margin:6px 0 4px;line-height:1.7}

.set .item{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 0;border-bottom:1px solid var(--hair);text-align:left}
.set .item span{color:var(--sub);font-size:14px}
.set .item.danger{color:var(--loss)}
.note{font-size:12px;color:var(--sub);line-height:1.8;margin-top:14px}
.seg{display:flex;gap:4px}
.seg button{font-size:13px;padding:5px 11px;border-radius:99px;color:var(--sub)}
.seg button.on{background:var(--soft);color:var(--ink);font-weight:600}
textarea.paste{width:100%;min-height:150px;border:1px solid var(--hair);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px;font:12px ui-monospace,Menlo,monospace;margin-top:10px}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 16px);transform:translate(-50%,-14px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);
  padding:9px 18px;border-radius:99px;font-size:13px;font-weight:600;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i>♠</i>牌局本</div>
    <button class="gear" data-act="settings" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <nav class="tabs">
    <button data-tab="home">总览</button>
    <button data-tab="list">明细</button>
    <button data-tab="stats">分析</button>
  </nav>
  <main id="view"></main>
</div>
<button class="add" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>记一笔</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
'use strict';
const KEY = 'poker.sessions.v1', CFG = 'poker.cfg.v1';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast('无法保存，浏览器存储不可用'); } }
};
let sessions = store.get(KEY, []);
let cfg = Object.assign({ cur: '¥', theme: 'auto' }, store.get(CFG, {}));
const save = () => { store.set(KEY, sessions); store.set(CFG, cfg); };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
// amount = 本场输赢；兼容旧版 buyIn/cashOut 记录
const amt = s => s.amount != null ? +s.amount : (+s.cashOut || 0) - (+s.buyIn || 0);
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
const cls = n => n > 0 ? 'win' : n < 0 ? 'loss' : 'sub';
const num = n => Math.abs(Math.round(n * 100) / 100).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const money = (n, sign = true) => (n < 0 ? '−' : sign && n > 0 ? '+' : '') + cfg.cur + num(n);
const short = n => { const a = Math.abs(n); return (n < 0 ? '−' : '') + (a >= 10000 ? (a / 10000).toFixed(1).replace(/\.0$/, '') + '万' : Math.round(a).toLocaleString('zh-CN')); };
let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2000); };
const sorted = () => [...sessions].sort((a, b) => a.date.localeCompare(b.date) || (a.created || 0) - (b.created || 0));
const applyTheme = () => cfg.theme === 'auto' ? document.documentElement.removeAttribute('data-theme') : document.documentElement.setAttribute('data-theme', cfg.theme);

let tab = 'home', period = 'all';
function inPeriod(s) {
  if (period === 'all') return true;
  if (period === 'month') return s.date.slice(0, 7) === today().slice(0, 7);
  if (period === 'year') return s.date.slice(0, 4) === today().slice(0, 4);
  const d = new Date(); d.setDate(d.getDate() - (period === '30' ? 30 : 90)); return s.date >= ymd(d);
}

function stats(list) {
  const v = list.map(amt), n = v.length, total = v.reduce((a, b) => a + b, 0);
  const w = v.filter(x => x > 0), l = v.filter(x => x < 0);
  let run = 0, bestRun = 0, worstRun = 0;
  for (const x of v) { run = x > 0 ? (run > 0 ? run + 1 : 1) : x < 0 ? (run < 0 ? run - 1 : -1) : 0; bestRun = Math.max(bestRun, run); worstRun = Math.min(worstRun, run); }
  let peak = 0, acc = 0, dd = 0; for (const x of v) { acc += x; peak = Math.max(peak, acc); dd = Math.min(dd, acc - peak); }
  const mean = n ? total / n : 0, sd = n > 1 ? Math.sqrt(v.reduce((a, x) => a + (x - mean) ** 2, 0) / (n - 1)) : 0;
  return { n, total, wins: w.length, losses: l.length, rate: n ? w.length / n : 0, mean, sd,
    avgWin: w.length ? sum(w, x => x) / w.length : 0, avgLoss: l.length ? sum(l, x => x) / l.length : 0,
    best: n ? Math.max(...v) : 0, worst: n ? Math.min(...v) : 0, bestRun, worstRun: -worstRun, drawdown: dd };
}

/* ---------- charts ---------- */
let curveData = null;
function curve(list, H = 150) {
  let a = 0; const pts = [0, ...list.map(s => (a += amt(s)))];
  const W = 340, T = 8, B = 8, min = Math.min(0, ...pts), max = Math.max(0, ...pts), sp = (max - min) || 1;
  const x = i => W * (pts.length > 1 ? i / (pts.length - 1) : 0), y = v => T + (H - T - B) * (1 - (v - min) / sp);
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const last = pts[pts.length - 1], col = last >= 0 ? 'var(--win)' : 'var(--loss)';
  curveData = { pts, list, x, y, W };
  return `<div class="chart"><div class="scrub" id="scrub"></div>
    <svg id="curve" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".16"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--hair)" stroke-dasharray="2 4"/>
      <path d="${d}L${W},${H}L0,${H}Z" fill="url(#g)"/>
      <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(pts.length - 1)}" cy="${y(last)}" r="3.5" fill="${col}"/>
      <g id="sg" visibility="hidden"><line id="sl" y1="0" y2="${H}" stroke="var(--sub)" stroke-width=".8"/><circle id="sc" r="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.5"/></g>
    </svg>
    <div class="cap"><span>${list[0] ? list[0].date.replace(/-/g, '.') : ''}</span><span>峰值 ${esc(cfg.cur)}${short(max)}</span><span>${list.length ? list[list.length - 1].date.replace(/-/g, '.') : ''}</span></div></div>`;
}
function bindCurve() {
  const svg = $('#curve'); if (!svg) return;
  const { pts, list, x, y, W } = curveData, tip = $('#scrub');
  const mv = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round(px / W * (pts.length - 1))));
    $('#sg').setAttribute('visibility', 'visible');
    ['x1', 'x2'].forEach(k => $('#sl').setAttribute(k, x(i)));
    $('#sc').setAttribute('cx', x(i)); $('#sc').setAttribute('cy', y(pts[i]));
    const s = list[i - 1];
    tip.textContent = s ? `${s.date.slice(5).replace('-', '/')} ${s.location || ''} ${money(amt(s))} · 累计 ${money(pts[i])}` : '起点';
    tip.style.opacity = 1;
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.max(half, Math.min(r.width - half, x(i) / W * r.width)) + 'px';
  };
  const end = () => { $('#sg').setAttribute('visibility', 'hidden'); tip.style.opacity = 0; };
  svg.addEventListener('pointerdown', mv); svg.addEventListener('pointermove', mv);
  svg.addEventListener('pointerleave', end); svg.addEventListener('pointerup', e => e.pointerType !== 'mouse' && end());
}

function bars(list) {
  const m = {}; list.forEach(s => { const k = s.date.slice(0, 7); m[k] = (m[k] || 0) + amt(s); });
  const keys = Object.keys(m).sort().slice(-12); if (!keys.length) return '';
  const W = 340, H = 130, T = 14, B = 20, vals = keys.map(k => m[k]);
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals), sp = (max - min) || 1;
  const y = v => T + (H - T - B) * (1 - (v - min) / sp), slot = W / keys.length, bw = Math.min(18, slot * .5);
  return `<div class="chart" style="margin-top:14px"><svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--hair)"/>
    ${keys.map((k, i) => { const v = m[k], cx = slot * i + slot / 2, top = y(Math.max(v, 0)), h = Math.max(1, Math.abs(y(v) - y(0)));
      return `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${h}" rx="2" fill="${v >= 0 ? 'var(--win)' : 'var(--loss)'}"/>
      ${keys.length <= 7 ? `<text x="${cx}" y="${v >= 0 ? top - 4 : top + h + 10}" text-anchor="middle" font-size="9" fill="var(--sub)">${short(v)}</text>` : ''}
      <text x="${cx}" y="${H - 4}" text-anchor="middle" font-size="9.5" fill="var(--sub)">${+k.slice(5)}月</text>`; }).join('')}</svg></div>`;
}

/* ---------- views ---------- */
function row(s) {
  const d = new Date(s.date + 'T00:00:00'), v = amt(s);
  return `<button class="r" data-edit="${esc(s.id)}"><div class="d"><b>${d.getDate()}</b>${d.getMonth() + 1}月 · ${WD[d.getDay()].slice(1)}</div>
    <div class="m"><div class="t">${esc(s.location || '未填地点')}</div>${s.note ? `<div class="n">${esc(s.note)}</div>` : ''}</div>
    <div class="v ${cls(v)}">${money(v)}</div></button>`;
}
const totalHTML = n => `<div class="total ${cls(n)}">${n < 0 ? '−' : n > 0 ? '+' : ''}<span class="cur">${esc(cfg.cur)}</span>${num(n)}</div>`;
const emptyHTML = () => `<div class="empty fade"><div class="suits">♠♥♣♦</div>
  <p>每打完一场，记下输赢和地点。<br>时间久了，数字会告诉你答案。</p>
  <button class="btn" data-act="add">记第一笔</button><br><button class="link" data-act="sample">先看看示例</button></div>`;

function homeView() {
  if (!sessions.length) return emptyHTML();
  const all = sorted(), st = stats(all), mo = stats(all.filter(s => s.date.slice(0, 7) === today().slice(0, 7)));
  return `<div class="fade"><div class="hero"><div class="eyebrow">累计盈亏</div>${totalHTML(st.total)}
    <div class="trio"><div><b class="tn">${st.n}</b>场次</div><div><b class="tn">${Math.round(st.rate * 100)}%</b>胜率</div><div><b class="tn ${cls(mo.total)}">${mo.n ? money(mo.total) : '–'}</b>本月</div></div></div>
    ${curve(all)}
    <h2>最近<button data-tab="list">全部 →</button></h2>
    <div class="rows">${all.slice(-6).reverse().map(row).join('')}</div></div>`;
}

function listView() {
  if (!sessions.length) return emptyHTML();
  const g = {}; sorted().reverse().forEach(s => (g[s.date.slice(0, 7)] ||= []).push(s));
  return `<div class="fade">${Object.entries(g).map(([m, a]) => { const t = sum(a, amt);
    return `<div class="mh"><span>${m.slice(0, 4)}.${m.slice(5)}<small>${a.length} 场</small></span><span class="${cls(t)}">${money(t)}</span></div>
      <div class="rows">${a.map(row).join('')}</div>`; }).join('')}</div>`;
}

function statsView() {
  if (!sessions.length) return emptyHTML();
  const P = [['all', '全部'], ['year', '今年'], ['90', '近 90 天'], ['30', '近 30 天'], ['month', '本月']];
  const list = sorted().filter(inPeriod), st = stats(list);
  const head = `<div class="periods">${P.map(([k, v]) => `<button data-period="${k}" class="${period === k ? 'on' : ''}">${v}</button>`).join('')}</div>`;
  if (!list.length) return head + `<div class="empty"><p>这段时间没有记录</p></div>`;
  const kv = (k, v, c = '') => `<div><span>${k}</span><b class="${c}">${v}</b></div>`;
  const locs = {}; list.forEach(s => (locs[s.location || '未填地点'] ||= []).push(amt(s)));
  const L = Object.entries(locs).map(([k, v]) => ({ k, n: v.length, t: v.reduce((a, b) => a + b, 0), w: v.filter(x => x > 0).length })).sort((a, b) => b.t - a.t);
  const maxAbs = Math.max(...L.map(o => Math.abs(o.t)), 1);
  const wd = Array.from({ length: 7 }, () => []); list.forEach(s => wd[new Date(s.date + 'T00:00:00').getDay()].push(amt(s)));
  return `<div class="fade">${head}
    <div class="hero" style="padding-top:30px"><div class="eyebrow">区间盈亏</div>${totalHTML(st.total)}</div>
    ${curve(list, 120)}
    <h2>核心数据</h2><div class="kv">
      ${kv('场次', st.n)}${kv('胜率', `${Math.round(st.rate * 100)}% · ${st.wins} 胜 ${st.losses} 负`)}
      ${kv('场均', money(st.mean), cls(st.mean))}${kv('赢的场次平均赢', money(st.avgWin), 'win')}${kv('输的场次平均输', money(st.avgLoss), 'loss')}
      ${kv('盈亏比', st.avgLoss ? (st.avgWin / -st.avgLoss).toFixed(2) : '–')}
      ${kv('单场最佳', money(st.best), cls(st.best))}${kv('单场最差', money(st.worst), cls(st.worst))}
      ${kv('最长连胜 / 连败', `${st.bestRun} / ${st.worstRun}`)}${kv('最大回撤', money(st.drawdown), st.drawdown < 0 ? 'loss' : '')}
      ${kv('单场波动（标准差）', esc(cfg.cur) + num(st.sd))}
    </div>
    <h2>按地点</h2><div>${L.map(o => `<div class="loc"><div class="top"><span>${esc(o.k)}</span><b class="${cls(o.t)}">${money(o.t)}</b></div>
      <div class="meta">${o.n} 场 · 胜率 ${Math.round(o.w / o.n * 100)}% · 场均 ${money(o.t / o.n)}</div>
      <div class="bar"><i style="width:${Math.abs(o.t) / maxAbs * 100}%;background:${o.t >= 0 ? 'var(--win)' : 'var(--loss)'}"></i></div></div>`).join('')}</div>
    <h2>按月</h2>${bars(list)}
    <h2>按星期</h2><div class="kv">${[1, 2, 3, 4, 5, 6, 0].filter(i => wd[i].length).map(i => { const t = wd[i].reduce((a, b) => a + b, 0);
      return kv(`${WD[i]} · ${wd[i].length} 场`, money(t), cls(t)); }).join('')}</div></div>`;
}

function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = ({ home: homeView, list: listView, stats: statsView })[tab]();
  bindCurve();
}

/* ---------- sheets ---------- */
function openSheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#scrim').classList.add('show'); $('#sheet').classList.add('show'); }
function closeSheet() { $('#scrim').classList.remove('show'); $('#sheet').classList.remove('show'); }
$('#scrim').onclick = closeSheet;
const ask = (title, msg, ok) => new Promise(res => {
  openSheet(`<div class="sh"><h3>${title}</h3></div><p class="msg">${msg}</p><div class="foot"><button class="btn ghost" id="aN">取消</button><button class="btn" style="background:var(--loss);color:#fff" id="aY">${ok}</button></div>`);
  $('#aN').onclick = () => { closeSheet(); res(false); }; $('#aY').onclick = () => { closeSheet(); res(true); };
});

function form(id) {
  const s = sessions.find(x => x.id === id), v = s ? amt(s) : null;
  let sign = v != null && v < 0 ? -1 : 1;
  const recent = []; sorted().reverse().forEach(x => x.location && !recent.includes(x.location) && recent.push(x.location));
  openSheet(`<div class="sh"><h3>${s ? '修改记录' : '记一笔'}</h3><button id="fX">取消</button></div>
    <div class="wl" id="wl"><button data-v="1">赢了</button><button data-v="-1">输了</button></div>
    <div class="amt" id="amtBox"><span>${esc(cfg.cur)}</span><input id="fA" type="number" inputmode="decimal" min="0" placeholder="0" value="${v != null ? Math.abs(v) : ''}" aria-label="金额"></div>
    <div class="field"><label for="fL">地点</label><input id="fL" value="${esc(s ? s.location : '')}" placeholder="在哪里打的" autocomplete="off"></div>
    ${recent.length ? `<div class="chips">${recent.slice(0, 6).map(l => `<button type="button" data-loc="${esc(l)}">${esc(l)}</button>`).join('')}</div>` : ''}
    <div class="field"><label for="fD">日期</label><input id="fD" type="date" value="${s ? s.date : today()}"></div>
    <div class="field last"><label for="fN">备注</label><input id="fN" value="${esc(s ? s.note : '')}" placeholder="选填" autocomplete="off"></div>
    <div class="foot">${s ? '<button class="del" id="fDel">删除</button>' : ''}<button class="btn" id="fS">保存</button></div>`);
  const paint = () => { $('#wl').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v === sign)); $('#amtBox').className = 'amt ' + (sign > 0 ? 'win' : 'loss'); };
  paint();
  $('#wl').onclick = e => { const b = e.target.closest('button'); if (b) { sign = +b.dataset.v; paint(); } };
  $('#sheet').querySelectorAll('[data-loc]').forEach(b => b.onclick = () => { $('#fL').value = b.dataset.loc; });
  $('#fX').onclick = closeSheet;
  if (!s) setTimeout(() => $('#fA').focus(), 350);
  $('#fS').onclick = () => {
    const a = parseFloat($('#fA').value);
    if (isNaN(a)) { toast('请输入金额'); $('#fA').focus(); return; }
    const rec = { id: s ? s.id : uid(), created: s ? s.created : Date.now(), date: $('#fD').value || today(),
      location: $('#fL').value.trim(), amount: sign * Math.abs(a), note: $('#fN').value.trim() };
    const i = sessions.findIndex(x => x.id === rec.id); if (i >= 0) sessions[i] = rec; else sessions.push(rec);
    save(); closeSheet(); render(); toast(`已记录 ${money(rec.amount)}`);
  };
  if (s) $('#fDel').onclick = async () => {
    if (await ask('删除这条记录', `${s.date} · ${esc(s.location || '未填地点')} · ${money(amt(s))}<br>删除后无法恢复。`, '删除')) { sessions = sessions.filter(x => x.id !== id); save(); render(); toast('已删除'); }
  };
}

const backup = () => JSON.stringify({ app: 'poker-log', version: 2, exported: new Date().toISOString(), sessions });
function settings() {
  const th = [['auto', '自动'], ['light', '浅色'], ['dark', '深色']];
  openSheet(`<div class="sh"><h3>设置</h3><button id="sX">完成</button></div><div class="set">
    <div class="item">外观<div class="seg">${th.map(([k, v]) => `<button data-th="${k}" class="${cfg.theme === k ? 'on' : ''}">${v}</button>`).join('')}</div></div>
    <div class="item">货币<div class="seg">${['¥', '$', 'HK$', '€'].map(c => `<button data-cur="${c}" class="${cfg.cur === c ? 'on' : ''}">${c}</button>`).join('')}</div></div>
    <button class="item" id="sCopy">复制备份<span>${sessions.length} 条 →</span></button>
    <button class="item" id="sPaste">粘贴恢复<span>→</span></button>
    <button class="item" id="sDl">下载备份文件<span>→</span></button>
    <button class="item" id="sUp">从文件恢复<span>→</span></button>
    <button class="item" id="sCsv">导出 CSV 表格<span>→</span></button>
    <button class="item danger" id="sClr">清空全部记录</button>
    <p class="note">记录只保存在本机浏览器里。换手机或清理浏览器前，请先复制备份，存到备忘录或发给自己。<br>
    iPhone：Safari 打开 → 分享 → 添加到主屏幕，即可像 App 一样使用。</p></div>`);
  $('#sX').onclick = closeSheet;
  $('#sheet').querySelectorAll('[data-th]').forEach(b => b.onclick = () => { cfg.theme = b.dataset.th; applyTheme(); save(); settings(); });
  $('#sheet').querySelectorAll('[data-cur]').forEach(b => b.onclick = () => { cfg.cur = b.dataset.cur; save(); render(); settings(); });
  $('#sCopy').onclick = async () => { try { await navigator.clipboard.writeText(backup()); toast('已复制，粘贴到备忘录保存'); } catch { pasteSheet(backup()); } };
  $('#sPaste').onclick = () => pasteSheet('');
  $('#sDl').onclick = () => download(`牌局本备份-${today()}.json`, backup(), 'application/json');
  $('#sUp').onclick = () => $('#fileIn').click();
  $('#sCsv').onclick = () => { const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    download(`牌局本-${today()}.csv`, '﻿' + [['日期', '地点', '输赢', '备注'], ...sorted().map(s => [s.date, s.location, amt(s), s.note])].map(r => r.map(q).join(',')).join('\n'), 'text/csv'); };
  $('#sClr').onclick = async () => { if (await ask('清空全部记录', `将删除全部 ${sessions.length} 条记录，无法恢复。<br>建议先复制备份。`, '全部清空')) { sessions = []; save(); render(); toast('已清空'); } };
}
function pasteSheet(text) {
  openSheet(`<div class="sh"><h3>${text ? '复制备份' : '粘贴恢复'}</h3><button id="pX">关闭</button></div>
    <p class="msg">${text ? '长按全选并复制下面的内容，保存到备忘录。' : '把之前复制的备份内容粘贴到下面。'}</p>
    <textarea class="paste" id="pT">${esc(text)}</textarea>${text ? '' : '<div class="foot"><button class="btn" id="pGo">恢复</button></div>'}`);
  $('#pX').onclick = closeSheet;
  if (text) $('#pT').select(); else $('#pGo').onclick = () => importText($('#pT').value);
}
function importText(t) {
  let arr; try { const d = JSON.parse(t); arr = Array.isArray(d) ? d : d.sessions; if (!Array.isArray(arr)) throw 0; } catch { toast('内容不完整，请重新复制'); return; }
  const m = new Map(sessions.map(s => [s.id, s])); let n = 0;
  arr.forEach(s => { if (s && s.id && /^\d{4}-\d\d-\d\d$/.test(s.date)) { m.set(s.id, s); n++; } });
  sessions = [...m.values()]; save(); closeSheet(); render(); toast(`已恢复 ${n} 条`);
}
function download(name, text, type) {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  catch { toast('无法下载，请用“复制备份”'); }
}
function sample() {
  const L = ['老王家', '星河俱乐部', '公司周五局', '澳门'], out = [], d = new Date(); d.setDate(d.getDate() - 150);
  let sd = 11; const r = () => (sd = (sd * 9301 + 49297) % 233280) / 233280;
  while (true) { d.setDate(d.getDate() + 3 + Math.floor(r() * 6)); if (d > new Date()) break;
    const li = r() < .1 ? 3 : Math.floor(r() * 3), base = [300, 800, 200, 3000][li];
    out.push({ id: uid(), created: Date.now() + out.length, date: ymd(d), location: L[li], amount: Math.round((r() - .43) * 2.4 * base / 10) * 10, note: '示例' }); }
  return out;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-period],[data-edit],[data-act]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); scrollTo({ top: 0 }); }
  else if (t.dataset.period) { period = t.dataset.period; render(); }
  else if (t.dataset.edit) form(t.dataset.edit);
  else if (t.dataset.act === 'add') form();
  else if (t.dataset.act === 'settings') settings();
  else if (t.dataset.act === 'sample') { sessions = sessions.concat(sample()); save(); render(); toast('已载入示例，可在设置中清空'); }
});
$('#fileIn').onchange = async e => { const f = e.target.files[0]; if (f) importText(await f.text()); e.target.value = ''; };

applyTheme(); render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
